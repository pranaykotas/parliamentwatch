[theme]
base = "light"

# Takshashila brand — wine primary, deep cream secondary surface, near-black ink
primaryColor = "#620d3c"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F5F2"
textColor = "#171413"
linkColor = "#620d3c"
borderColor = "rgba(23, 20, 19, 0.16)"

# Zero border-radius, hairline borders — house style has no rounded corners or shadows
baseRadius = "none"
buttonRadius = "none"
showWidgetBorder = true
showSidebarBorder = true

# Inter for everything with words in it; Roboto Mono for metadata (captions, code, labels)
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "Roboto Mono:https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"

# Big type gets its authority from size, never bold
headingFontWeights = 400
metricValueFontWeight = 400
